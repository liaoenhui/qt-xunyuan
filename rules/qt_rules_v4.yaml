  "redlines": {
    "R1": {"title": "单镜头，无切镜", "hard": true, "page": 4, "original": "整段视频必须是一个连续不间断的镜头；对话正反打、蒙太奇、多机位切换不收。", "deterministic": "shot_count"},
    "R2": {"title": "横屏，宽高比 1.5-2", "hard": true, "page": 4, "original": "竖屏不收。常见合格比例：16:9、3:2、1.85:1、2:1。", "deterministic": "aspect_ratio"},
    "R3": {"title": "镜头稳定，无畸变、无运动模糊", "hard": true, "page": 4, "original": "手持稳定器级别为底线；鱼眼/广角畸变不收；任何后期动态模糊伪影不收。", "deterministic": null},
    "R4": {"title": "无水印、字幕、弹幕、UI/HUD、鼠标、黑边、台标、马赛克", "hard": true, "page": 4, "original": "可通过裁切去除的水印可豁免，但裁切后画质和宽高比仍须达标并标注。", "deterministic": null},
    "R5": {"title": "必须有音频且全程不静默", "hard": true, "page": 4, "original": "必须有音轨且全程不静默，音画同步；原声优先，BGM 完全盖住交互音效不收。", "deterministic": "audio_and_silence"},
    "R6": {"title": "动画/特效合成无穿模、瞬移等问题", "hard": true, "page": 4, "original": "无穿模、人物崩坏抽搐、时序不一致；特效边界干净，无明显抠像残留。", "deterministic": null},
    "R7": {"title": "内容合规", "hard": true, "page": 4, "original": "内容合规，规避政治敏感。", "deterministic": null},
    "R8": {"title": "文件可正常播放，信息完整", "hard": true, "page": 4, "original": "损坏文件、缺少必要信息不收。", "deterministic": "probe"},
    "R9": {"title": "画面清晰且不得升源", "hard": true, "page": 5, "original": "无失焦、过曝、过暗、严重色偏；必须原生分辨率，不接受升源。", "deterministic": "resolution_only"},
    "R10": {"title": "起止干净，无卡顿、跳帧、闪屏、违规变速", "hard": true, "page": 5, "original": "禁止快放、延时、慢放等后期变速处理；T8.4 慢动作摄影除外。", "deterministic": null, "exempt_units": ["T8.4"]},
    "R11": {"title": "镜头锚定主体", "hard": true, "page": 5, "original": "第一人称或第三人称跟随；主体必须持续在画面内；纯风景/固定监控机位不收。", "deterministic": null},
    "R12": {"title": "背景不能虚化", "hard": true, "page": 5, "original": "背景必须清晰可辨，禁止浅景深大光圈造成的背景模糊。", "deterministic": null},
    "R13": {"title": "原则上地面视角", "hard": true, "page": 5, "original": "仅 T1.7、T6.3、T6.8 允许非地面视角；其余必须地面拍摄。", "deterministic": null, "exempt_units": ["T1.7", "T6.3", "T6.8"]},
    "R14": {"title": "画面中必须有活性物体", "hard": true, "page": 5, "original": "飞鸟、飘旗、人群、溪流瀑布等；纯静态场景不收。", "deterministic": null},
    "R15": {"title": "禁止变焦", "hard": true, "page": 5, "original": "不接受光学或数码变焦；大小变化只能来自实际距离改变。", "deterministic": null},
    "R16": {"title": "素材类型合规", "hard": true, "page": 5, "original": "桶1-8必须实拍，桶9必须动画/风格化；全部不接受游戏录制，包括游戏过场动画。", "deterministic": "declared_material_type"},
    "R17": {"title": "时长合规", "hard": true, "page": 6, "original": "所有视频时长不少于5秒；每桶三档均须覆盖且每档不少于20%；超过60秒计入长档。", "deterministic": "duration"}
